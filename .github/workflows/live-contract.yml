name: Live contract

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      store:
        description: "one store to check, or empty for all of them"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-contract
  cancel-in-progress: true

jobs:
  contract:
    name: contract (${{ matrix.store }})
    # bot protection on several stores refuses datacenter ranges, so the job
    # runs wherever the LIVE_RUNNER_LABELS repository variable points, such as
    # '["self-hosted", "live"]'; without it, a github-hosted runner
    runs-on: ${{ fromJSON(vars.LIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        store:
          - mercadona
          - consum
          - plusfresc
          - bonarea
          - carrefour
          - lidl
          - bonpreu
          - dia
          - aldi
          - eroski
          - caprabo
          - ahorramas
          - alcampo
          - condis
    permissions:
      contents: read
      issues: write
    steps:
      - name: Skip stores that were not asked for
        id: wanted
        env:
          ASKED: ${{ github.event.inputs.store }}
          STORE: ${{ matrix.store }}
        run: |
          if [ -z "${ASKED}" ] || [ "${ASKED}" = "${STORE}" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check out repository
        if: steps.wanted.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        if: steps.wanted.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and test tools
        if: steps.wanted.outputs.run == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Run the live contract for ${{ matrix.store }}
        id: contract
        if: steps.wanted.outputs.run == 'true'
        env:
          STORE: ${{ matrix.store }}
        run: |
          set -o pipefail
          pytest "tests/live/test_${STORE}.py" --live --no-cov -p no:cacheprovider \
            -rs -q 2>&1 | tee contract.log
      - name: Tell a run the store refused throughout apart
        id: verdict
        if: steps.contract.outcome == 'success'
        run: |
          # a block or a challenge skips a test as inconclusive. some skips are
          # normal under a waf budget, but a run with no pass at all means the
          # store refused us throughout and says nothing about its contract
          summary=$(tail -n 1 contract.log)
          if [[ "${summary}" == *skipped* && "${summary}" != *passed* ]]; then
            echo "inconclusive=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Open or update the store's issue
        if: >-
          (failure() && steps.contract.outcome == 'failure')
          || steps.verdict.outputs.inconclusive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STORE: ${{ matrix.store }}
          INCONCLUSIVE: ${{ steps.verdict.outputs.inconclusive }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          labels=()
          if [ "${INCONCLUSIVE}" = "true" ]; then
            title="live contract inconclusive: ${STORE}"
            outcome="was refused on every test"
            gh label create inconclusive --color ededed --force \
              --description "the live contract could not reach the store"
            labels=(--label inconclusive)
          else
            title="live contract failing: ${STORE}"
            outcome="failed"
          fi
          {
            echo "the weekly live contract for \`${STORE}\` ${outcome}: ${RUN_URL}"
            echo
            echo '```'
            tail -n 60 contract.log
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md "${labels[@]}"
          fi
