[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supermercapy"
dynamic = ["version"]
description = "typed clients for the public storefront apis of spanish supermarkets, for sync code and asyncio"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Joel Taylor", email = "contact@joeltaylor.business" },
]
keywords = [
  "supermarket",
  "api",
  "client",
  "prices",
  "catalog",
  "mercadona",
  "consum",
  "plusfresc",
  "bonarea",
  "carrefour",
  "lidl",
  "bonpreu",
  "dia",
  "eroski",
  "caprabo",
  "aldi",
  "ahorramas",
  "alcampo",
  "condis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=2.4,<2.5",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.16.10,<0.17",
  "twine>=6.1",
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocstrings[python]>=1.0.6,<2",
]

[project.scripts]
supermercapy = "supermercapy.cli:main"

[project.urls]
Homepage = "https://github.com/jtayped/supermercapy"
Documentation = "https://jtayped.github.io/supermercapy/"
Issues = "https://github.com/jtayped/supermercapy/issues"
Repository = "https://github.com/jtayped/supermercapy"
Changelog = "https://github.com/jtayped/supermercapy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/supermercapy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/supermercapy"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/supermercapy --cov-branch --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: calls a real storefront; skipped unless pytest is given --live",
]

[tool.coverage.run]
source = ["src/supermercapy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
